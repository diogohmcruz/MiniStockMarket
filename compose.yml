services:
  grafana-otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
      - "3100:3100"
      - "4317:4317"
      - "4318:4318"
      - "9090:9090"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - grafana-storage:/var/lib/grafana
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 10
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    command: >-
      redpanda start \
      --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
      --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092 \
      --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082 \
      --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082 \
      --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081 \
      --rpc-addr redpanda:33145 \
      --advertise-rpc-addr redpanda:33145 \
      --mode dev-container \
      --smp 1 \
      --default-log-level=info
    ports:
      - target: 18081
        published: 18081
        protocol: tcp
        mode: host
      - target: 18082
        published: 18082
        protocol: tcp
        mode: host
      - target: 19092
        published: 19092
        protocol: tcp
        mode: host
      - target: 9644
        published: 19644
        protocol: tcp
        mode: host
    networks:
      - redpanda_network
    healthcheck:
      test: [ "CMD", "rpk", "cluster", "info" ]
      interval: 10s
      timeout: 15s
      retries: 10
    restart: unless-stopped
  redpanda_console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - target: 8080
        published: 8083
        protocol: tcp
        mode: host
    networks:
      - redpanda_network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: ministockmarket-postgres
    # Logical decoding is required by Debezium to read the outbox tables from the WAL.
    command: [ "postgres", "-c", "wal_level=logical" ]
    environment:
      POSTGRES_DB: ministockmarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - redpanda_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ministockmarket" ]
      interval: 10s
      timeout: 5s
      retries: 10
  debezium-connect:
    image: quay.io/debezium/connect:3.0
    container_name: debezium-connect
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: stock-exchange-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m" # the default heap is too big for a small Colima VM
    ports:
      - "8084:8083" # 8083 is taken by the Redpanda console
    networks:
      - redpanda_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/connectors" ]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  redpanda_network:
    driver: bridge

volumes:
  grafana-storage:
  postgres-data:
