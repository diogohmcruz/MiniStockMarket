spring:
  application:
    name: stock-exchange
  cache:
    type: caffeine
    cache-names: tickers
    caffeine:
      spec: maximumSize=100,expireAfterWrite=30s
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  datasource:
    url: jdbc:h2:mem:ministockmarket
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        client.dns.lookup: use_all_dns_ips
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.UUIDDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: ${spring.application.name}
      properties:
        spring.json.trusted.packages: '*'
        spring.json.value.default.type: io.github.diogohmcruz.marketlibrary.api.dto.OrderDTO

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: '*'

live-market:
  kafka:
    enabled: true
    order-topic: orders
    trade-topic: trades
